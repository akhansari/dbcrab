name: checks

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  checks_on_commit:
    runs-on: codeberg-medium
    container:
      image: rust:1

    steps:
      - name: Actions runtime
        run: |
          apt-get update
          apt-get install nodejs -y

      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependencies
        run: |
          rustup component add rustfmt clippy
          cargo fetch --locked

      - name: Check formatting
        run: |
          cargo fmt --check

      - name: Check errors and common mistakes
        run: |
          cargo check --locked
          cargo clippy --locked

      - name: Check tests
        run: cargo test --locked
