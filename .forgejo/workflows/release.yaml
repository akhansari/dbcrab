name: release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  release:
    runs-on: codeberg-small
    container:
      image: rust:1

    steps:
      - name: Actions runtime
        run: |
          apt-get update
          apt-get install nodejs npm -y

      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --locked --no-verify
          npx --yes git-cliff --latest --output=release-notes.md

      - name: Create release
        uses: actions/forgejo-release@v2.13.1
        with:
          direction: upload
          skip-assets: true
          override: true
          release-notes-file: release-notes.md
