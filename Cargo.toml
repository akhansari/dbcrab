[package]
name = "dbcrab"
version = "0.6.0"
edition = "2024"
description = "Modern REPL-first PostgreSQL client."
license = "AGPL-3.0-or-later"
repository = "https://gitlab.com/akhansari/dbcrab"
homepage = "https://gitlab.com/akhansari/dbcrab"
readme = "README.md"
categories = ["database", "command-line-utilities"]
keywords = ["database-management", "postgres", "repl", "tui"]
authors = ["Amin Khansari"]

[dependencies]
ansi-to-tui = { version = "8.0.1", default-features = false }
clap = "4.6.1"
crossterm = { version = "0.29.0", features = ["osc52"] }
csv = "1.3"
futures-util = "0.3"
kdl = { version = "6.7.1", default-features = false, features = ["span"] }
nu-ansi-term = "0.50.3"
ratatui = "0.30.2"
ratatui-textarea = "0.9.2"
reedline = "0.49.0"
serde_json = "1.0"
sqlparser = "0.62.0"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
] }
tabled = { version = "0.21.0", default-features = false, features = ["ansi"] }
tokio = { version = "1.52.3", features = [
    "fs",
    "io-util",
    "macros",
    "rt-multi-thread",
    "signal",
    "time",
] }
