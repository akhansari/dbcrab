[package]
name = "dbcrab"
version = "0.3.0"
edition = "2024"
description = "Modern REPL-first PostgreSQL client."
license = "AGPL-3.0-or-later"
repository = "https://codeberg.org/akhansari/dbcrab"
homepage = "https://codeberg.org/akhansari/dbcrab"
readme = "README.md"

[dependencies]
ansitok = "0.3.0"
clap = "4.6.1"
crossterm = "0.29.0"
nu-ansi-term = "0.50.3"
ratatui = "0.30.2"
ratatui-textarea = "0.9.2"
reedline = "0.48.0"
serde_json = "1.0"
sqlparser = "0.62.0"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
] }
tabled = { version = "0.21.0", features = ["ansi"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
