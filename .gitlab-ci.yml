stages:
  - check
  - build
  - release

variables:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

checks:
  stage: check
  image: rust:1
  before_script:
    - rustup component add rustfmt clippy
    - cargo fetch --locked
  script:
    - cargo fmt --check
    - cargo check --locked
    - cargo clippy --locked
    - cargo test --locked
  only:
    refs:
      - merge_requests
      - main
      - /^v.*$/

build-release:
  stage: build
  image: ghcr.io/rust-cross/cargo-zigbuild:0.23.0
  before_script:
    - rustup toolchain install stable --profile minimal --target "$TARGET"
    - |
      if [ "$TARGET" = x86_64-pc-windows-gnu ]; then
        apt-get update
        apt-get install -y --no-install-recommends binutils-mingw-w64-x86-64
      fi
  script:
    - cargo +stable zigbuild --locked --release --target "$TARGET"
    - |
      case "$TARGET" in
        *-windows-*) binary=dbcrab.exe ;;
        *) binary=dbcrab ;;
      esac
      mkdir -p dist
      archive="dbcrab-$CI_COMMIT_TAG-$TARGET.tar.gz"
      tar -C "target/$TARGET/release" -czf "dist/$archive" "$binary"
      (cd dist && sha256sum "$archive" > "$archive.sha256")
  artifacts:
    name: "dbcrab-$CI_COMMIT_TAG-$TARGET"
    paths:
      - dist/
    expire_in: 1 week
  parallel:
    matrix:
      - TARGET:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-gnu
  only:
    refs:
      - /^v.*$/

publish:
  stage: release
  image: rust:1
  script:
    - echo "temp disabled"
    # - cargo publish --locked --no-verify --allow-dirty
  only:
    refs:
      - /^v.*$/

release:
  stage: release
  image: alpine
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
    GIT_DEPTH: 0
  needs:
    - job: publish
    - job: build-release
      artifacts: true
  before_script:
    - apk update
    - apk add git-cliff glab
  script:
    - git-cliff --latest --output=release-notes.md
    - glab release create "$CI_COMMIT_TAG" dist/* --name "$CI_COMMIT_TAG" --notes-file release-notes.md --ref "$CI_COMMIT_SHA" --use-package-registry
  only:
    refs:
      - /^v.*$/
